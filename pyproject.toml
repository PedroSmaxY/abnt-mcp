[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abnt-mcp"
version = "0.1.0"
description = "ABNT Copilot MCP - Servidor Model Context Protocol definitivo para elaboração, revisão e compilação de TCCs, dissertações e artigos no padrão ABNT"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Pedro", email = "pedro@example.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "abnt",
    "nbr14724",
    "nbr10520",
    "nbr6023",
    "academic",
    "latex",
    "typst",
    "pandoc",
    "tcc",
    "bibtex"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "fastmcp>=0.4.0",
    "pypdf>=4.0.0",
    "bibtexparser>=2.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
abnt-mcp = "abnt_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/abnt_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
