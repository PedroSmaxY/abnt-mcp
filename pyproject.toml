[project]
name = "abnt-mcp"
version = "0.1.0"
description = "O copiloto definitivo para TCC e trabalhos academicos no padrao ABNT via Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ABNT-MCP Team" }
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "bibtexparser>=1.4.0,<2.0.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
abnt-mcp = "abnt_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
