name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md Updated on Pull Requests
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Arquivos alterados no PR:"
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -qE "^(src/|specs/|pyproject\.toml)"; then
            if ! echo "$CHANGED_FILES" | grep -q "^CHANGELOG\.md$"; then
              echo "::error::Alterações em src/, specs/ ou pyproject.toml exigem atualização obrigatória do CHANGELOG.md!"
              exit 1
            fi
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run Test Suite with Pytest & Coverage
        run: uv run pytest --cov=abnt_mcp --cov-report=term-missing --cov-report=xml

      - name: Test CLI Interface
        run: uv run abnt-mcp --help
